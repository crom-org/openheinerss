version: 2

project_name: openheinerss

before:
  hooks:
    - go mod tidy

builds:
  - id: openheinerss
    main: ./cmd/openheinerss/main.go
    binary: openheinerss
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/crom-org/openheinerss/cmd/openheinerss.Version={{ .Version }}
      - -X github.com/crom-org/openheinerss/cmd/openheinerss.Commit={{ .Commit }}
      - -X github.com/crom-org/openheinerss/cmd/openheinerss.Date={{ .Date }}

archives:
  - id: default
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - logo.jpg
      - documentacao/*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
