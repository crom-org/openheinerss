name: CI - Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-go:
    name: Go Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.22', '1.23']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Go Tests
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -o openheinerss cmd/openheinerss/main.go

      - name: Run CLI Doctor Check
        run: ./openheinerss --version

  test-sdks:
    name: Validate SDKs (Node, Python, PHP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate TypeScript SDK
        run: |
          cd sdk/typescript
          npm install --package-lock-only || npm install
          npx tsc --noEmit || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python SDK
        run: |
          python -m py_compile sdk/python/openheinerss/*.py

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate PHP SDK Syntax
        run: |
          find sdk/php/src -name "*.php" -exec php -l {} \;
